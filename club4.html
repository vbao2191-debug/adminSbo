<!DOCTYPE html>
<html>
<head>
  <title>WYNN Dashboard</title>
  <style>
    body{background:#070b11;color:white;font-family:Arial;padding:15px}
    .logo{font-size:32px;color:#f5c400;font-weight:bold}
    .box{background:#101820;padding:18px;margin:8px 0;border-radius:10px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .green{color:#00ff73}.red{color:#ff2b55}
    .row{display:grid;grid-template-columns:1fr 1fr 1fr;padding:14px;border-bottom:1px solid #222}
  </style>
</head>
<body>
  <div class="logo">WYNN / SẢNH CHÍNH</div>
  <div class="box" style="margin-bottom:15px;text-align:center;">
  <div style="font-size:18px;letter-spacing:2px;">AVAILABLE BALANCE</div>
  <h1 class="green" style="font-size:48px;">$32,000</h1>
</div>

  <div class="grid">
    <div class="box">TỔNG NGƯỜI CHƠI<br><h1 id="count">0</h1></div>
<div class="box">TỔNG SỐ TIỀN<br><h1 id="total" class="green">$0</h1></div>
<div class="box">LỜI/LỖ TUẦN NÀY<br><h1 id="weekProfit" class="green">$0</h1></div>
  </div>

  <div class="box">
    <div class="row"><b>TÊN</b><b>SỐ DƯ</b><b>LỜI/LỖ</b></div>
    <div id="list"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://lkxbrysqgxynizondicw.supabase.co";
const SUPABASE_KEY = "sb_publishable_0IM2B8r4kzZDc5SdjhgN5Q_EA9FOIgh";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function load(){
  const { data, error } = await db.from("Player 4").select("*").order("id");
  if(error){ document.body.innerHTML += error.message; return; }

  document.getElementById("count").innerText = data.length;
  let total = 0;
let weekProfit = 0;
let startTotal = data.length * 1000;

  document.getElementById("list").innerHTML = data.map(p=>{
    let profit = Number(p.Balance || 0) - 1000;
weekProfit += profit;
    return `<div class="row">
      <div>${p.name}</div>
      <div class="green">$${p.Balance}</div>
      <div class="${profit>=0?'green':'red'}">$${profit}</div>
    </div>`;
  }).join("");
document.getElementById("weekProfit").innerText =
"$" + weekProfit;

document.getElementById("total").innerText = "$" + (4000 - weekProfit);
"$" + (startTotal - weekProfit);

}
load();

</script>
</body>
</html>
